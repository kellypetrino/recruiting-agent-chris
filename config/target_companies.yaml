# Search filters applied across all sources at the rule-based pre-filter stage.
filters:
  title_keywords_include:
    - "analyst"
    - "financial analyst"
    - "finance"
    - "operations"
    - "business analyst"
    - "program manager"
    - "project manager"
    - "associate"
    - "rotational"
    - "workflow"
    - "coordinator"
    - "fp&a"
    - "planning"
    - "reporting"
    - "accounting"
  title_keywords_exclude:
    - "director"
    - "VP"
    - "vice president"
    - "head of"
    - "principal"
    - "intern"
  locations_include:
    - "new york"
    - "nyc"
    - "ny"
    - "new jersey"
    - "nj"
    - "secaucus"
    - "remote"
    - "remote - us"
    - "remote (us)"
    - "united states"
  max_age_days: 14
